name: Refine family voice copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-family-voice.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine military-affiliated copy and person consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '<p class="lede">This decides which side of the line their story belongs on. People already in uniform are asked what changed afterward; people who entered later are asked what made them raise their hand.</p>',
              '<p class="lede">A couple of quick questions will help us ask about their experience accurately.</p>'
            ),
            (
              '<button class="choice" id="familyBefore" type="button">Yes — they were already serving<small>They entered service before September 11, 2001.</small></button>',
              '<button class="choice" id="familyBefore" type="button">Yes — they were already serving<small>They entered service before that morning.</small></button>'
            ),
            (
              '<button class="choice" id="familyAfter" type="button">No — they entered after that day<small>They enlisted or commissioned from September 2001 onward.</small></button>',
              '<button class="choice" id="familyAfter" type="button">No — they entered after that day<small>They enlisted or commissioned on or after September 11, 2001.</small></button>'
            ),
            (
              '<button class="choice" id="familySkip" type="button">My connection does not fit either option<small>Continue to the birth-year mirror without placing a service-year mark.</small></button>',
              '<button class="choice" id="familySkip" type="button">My connection does not fit either option<small>Continue without answering about a service year.</small></button>'
            ),
            (
              'var WHY_PRE=["Everything sped up","My first deployment","I stayed past when I\'d planned to leave","My unit\'s mission changed","I got out","Nothing was routine again","I\'d already deployed before","Still working that out"];',
              'var WHY_PRE=["Everything sped up","My first deployment","I stayed past when I\'d planned to leave","My unit\'s mission changed","I got out","Nothing was routine again","I\'d already deployed before","Still working that out"];\nvar WHY_AFTER_FAMILY=["That morning","Family tradition","School / GI Bill","They needed the work","They wanted out of their hometown","Someone they knew served","Someone they knew didn\'t come back","The reasons are still hard to name"];\nvar WHY_PRE_FAMILY=["Everything sped up","They deployed for the first time","They stayed past when they had planned to leave","Their unit\'s mission changed","They left the service","Nothing was routine again","They had already deployed before","The change is still hard to name"];'
            ),
            (
              '$("preYearSub").textContent="Any year up to 2001. Their mark will appear in the separate ‘already serving’ block at the start of the timeline.";',
              '$("preYearSub").textContent="Enter any year up to 2001.";\n  $("oneLine").placeholder="Something you remember about what changed for them.";'
            ),
            (
              '$("yearQ").textContent="What year did your person raise their hand?";\n  $("yearNext").disabled=true;mark(null);show("s-year");',
              '$("yearQ").textContent="What year did your person raise their hand?";\n  $("oneLine").placeholder="Something you remember about why they joined.";\n  $("yearNext").disabled=true;mark(null);show("s-year");'
            ),
            (
              '$("whyQ").textContent=st.path==="family"?"What made them raise their hand?":"What made you raise your hand?";\n  $("whySub").textContent="Pick as many as are true. There is no expected answer — the recorded ones range from grief to the GI Bill.";\n  buildChips(WHY_AFTER);show("s-why");',
              '$("whyQ").textContent=st.path==="family"?"What made them raise their hand?":"What made you raise your hand?";\n  $("whySub").textContent=st.path==="family"\n    ?"Pick as many as fit their story. There is no expected answer."\n    :"Pick as many as are true. There is no expected answer — the recorded ones range from grief to the GI Bill.";\n  $("oneLine").placeholder=st.path==="family"\n    ?"Something you remember about why they joined."\n    :"Something you remember about deciding.";\n  buildChips(st.path==="family"?WHY_AFTER_FAMILY:WHY_AFTER);show("s-why");'
            ),
            (
              '$("whyQ").textContent="What changed for them after?";\n    $("whySub").textContent="They were already serving that morning, so the question is not why they joined. Pick as many changes as are true.";',
              '$("whyQ").textContent="What changed for them after September 11?";\n    $("whySub").textContent="Pick as many as fit their experience.";\n    $("oneLine").placeholder="Something you remember about what changed for them.";'
            ),
            (
              '$("whyQ").textContent="What changed for you after?";\n    $("whySub").textContent="You didn\'t decide anything that morning — it was decided around you. Pick as many as are true.";',
              '$("whyQ").textContent="What changed for you after?";\n    $("whySub").textContent="You didn\'t decide anything that morning — it was decided around you. Pick as many as are true.";\n    $("oneLine").placeholder="Something you remember about what changed.";'
            ),
            (
              'buildChips(WHY_PRE);show("s-why");',
              'buildChips(st.path==="family"?WHY_PRE_FAMILY:WHY_PRE);show("s-why");'
            ),
            (
              '$("oneLine").value="";$("attrib").value="";$("birth").value="";$("preYear").value="";$("mobileYear").value="";',
              '$("oneLine").value="";$("oneLine").placeholder="Something you remember.";$("attrib").value="";$("birth").value="";$("preYear").value="";$("mobileYear").value="";'
            )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected text:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/refine-family-voice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine military-affiliated wording and person consistency"
          git push