name: Apply family flow fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-family-flow-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply military-affiliated pre-2001 flow fix
        shell: bash
        run: |
          cat > /tmp/family-flow.patch <<'PATCH'
