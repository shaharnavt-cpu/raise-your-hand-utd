name: Add Identity callback redirect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-identity-callback-redirect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route Identity email links to the login page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<body>'
          script = '''<body>
          <script>
          (function(){
            var h=window.location.hash||"";
            if(/^#(?:invite|confirmation|recovery|email_change)_token=/.test(h)){
              window.location.replace("/login/"+h);
            }
          })();
          </script>'''
          if 'email_change)_token' not in text:
              if marker not in text:
                  raise SystemExit('Could not find <body> in index.html')
              text = text.replace(marker, script, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-identity-callback-redirect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add staff login and Identity callback handling"
          git push
